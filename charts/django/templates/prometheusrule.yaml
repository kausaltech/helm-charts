{{- if and .Values.metrics.enabled .Values.metrics.prometheusRule.enabled }}
{{- /*
  The `job` label the Prometheus Operator attaches to these targets. With no
  jobLabel on the ServiceMonitor the operator defaults it to the Service name,
  which is django.fullname-metrics-collector -- but a cluster with its own relabeling can differ,
  and a rule with the wrong job matcher renders fine and then never fires.
  Verify with: scrape_duration_seconds{namespace="<ns>", container="metrics-collector"}
*/}}
{{- $job := .Values.metrics.prometheusRule.jobName | default (printf "%s-metrics-collector" (include "django.fullname" .)) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "django.fullname" . }}
  labels:
    {{- include "django.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ include "django.fullname" . }}
    {{- with .Values.metrics.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ include "django.fullname" . }}.metrics-collector
      rules:
        - alert: DjangoMetricsCollectorDown
          expr: 'up{namespace="{{ .Release.Namespace }}", job="{{ $job }}", container="metrics-collector"} == 0'
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'Metrics Collector for {{ include "django.fullname" . }} is not being scraped'
            description: 'The namespace Collector has not answered a scrape for 15m.'

        {{- if .Values.metrics.sourceHeartbeatAlerts.enabled }}
        - alert: DjangoMetricsSourceMissing
          expr: >-
            kube_pod_container_status_running{namespace="{{ .Release.Namespace }}", container="{{ .Chart.Name }}", pod=~"{{ include "django.fullname" . }}-[a-z0-9]+-[a-z0-9]+"} == 1
            unless on(namespace, pod, container)
            max_over_time(service_heartbeat{namespace="{{ .Release.Namespace }}", container="{{ .Chart.Name }}"}[2m])
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'Metrics from Django pod {{ "{{ $labels.pod }}" }} are missing'
            description: 'The running Django container has not delivered a heartbeat through the Collector to Prometheus.'

        {{- if and .Values.celery.worker.enabled .Values.metrics.celeryWorker.enabled }}
        - alert: CeleryMetricsSourceMissing
          expr: >-
            kube_pod_container_status_running{namespace="{{ .Release.Namespace }}", container="celery-worker", pod=~"{{ include "django.fullname" . }}-{{ .Values.celery.worker.componentName }}-[a-z0-9]+-[a-z0-9]+"} == 1
            unless on(namespace, pod, container)
            max_over_time(service_heartbeat{namespace="{{ .Release.Namespace }}", container="celery-worker"}[2m])
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'Metrics from Celery pod {{ "{{ $labels.pod }}" }} are missing'
            description: 'The running Celery container has not delivered a heartbeat through the Collector to Prometheus.'
        {{- end }}
        {{- end }}

        - alert: DjangoMetricsCollectionSlow
          expr: 'scrape_duration_seconds{namespace="{{ .Release.Namespace }}", job="{{ $job }}", container="metrics-collector"} > {{ .Values.metrics.prometheusRule.slowScrapeSeconds }}'
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: 'Metrics collection for {{ include "django.fullname" . }} is slow'
            description: 'Scraping the Collector takes over {{ .Values.metrics.prometheusRule.slowScrapeSeconds }}s.'

        - alert: DjangoMetricsCollectorRestarting
          expr: 'increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}", container="metrics-collector", pod=~"{{ include "django.fullname" . }}-.*"}[1h]) > 0'
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'Metrics Collector for {{ include "django.fullname" . }} is restarting'
            description: 'The namespace Collector restarted in the last hour.'
{{- end }}
